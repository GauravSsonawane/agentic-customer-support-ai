version: '3.8'

services:
  backend:
    build: .
    container_name: agentic-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8070 --reload
    volumes:
      - .:/app
    ports:
      - "8070:8070"
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8070/query
    networks:
      - agent_network

  ui:
    build: .
    container_name: agentic-ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8070/query
    depends_on:
      - backend
    networks:
      - agent_network

networks:
  agent_network:
    driver: bridge
